name: Build
on:
    push:
        branches: [ main ]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
            -   name: Setup Java
                uses: actions/setup-java@v5
                with:
                    distribution: "liberica"
                    java-version: "25"
            -   name: Env
                run: |
                    echo "JAVA_HOME: $JAVA_HOME"
                    java --version
                    gradle -v
            -   name: Build
                run: |
                    chmod a+x ./gradlew
                    ./gradlew clean bootJar
                    mkdir -p ./dist
                    cp ./platform-services/admin-server/build/libs/admin.jar ./dist/admin.jar
                    cp ./platform-services/app-server/build/libs/app.jar ./dist/app.jar
